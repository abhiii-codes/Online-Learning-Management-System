# Database Configuration for Online LMS
# By default, points to MySQL 8.x.
# If MySQL server is unreachable, the system automatically falls back to embedded H2 (MySQL Mode).

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/lms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
db.username=root
db.password=root

# HikariCP Pool Settings
hikari.maximumPoolSize=10
hikari.minimumIdle=2
hikari.idleTimeout=300000
hikari.connectionTimeout=3000
hikari.maxLifetime=1800000
